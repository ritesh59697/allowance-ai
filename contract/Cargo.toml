[package]
name = "haptix-leash"
description = "On-chain spending policy for AI agents: function-call key spends under limits, passkey approves the rest"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ritesh59697/haptix-leash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
