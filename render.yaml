# Render blueprint for the arena server (agent/src/server.ts).
# Secrets are marked sync: false: Render asks for them in the dashboard and
# they never live in this repository.
services:
  - type: web
    name: allowance-arena
    runtime: node
    rootDir: agent
    # Free plan: sleeps after idle time (first request then takes ~1 min) and
    # has no persistent disk, so the attempt feed resets on each restart.
    # On-chain stats are unaffected. Switch to a paid plan + disk for durability.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # NEAR
      - key: NEAR_RPC_URL
        value: https://near-testnet.drpc.org
      - key: NEAR_EXPLORER_TX_URL
        value: https://testnet.nearblocks.io/txns/
      - key: LEASH_ACCOUNT
        sync: false
      - key: AGENT_SECRET_KEY
        sync: false
      - key: GAS_CALL_TGAS
        value: "50"
      - key: NEAR_TIMEOUT_MS
        value: "30000"
      - key: NEAR_RETRIES
        value: "3"
      # LLM (NEAR AI Cloud)
      - key: LLM_BASE_URL
        value: https://cloud-api.near.ai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: Qwen/Qwen3.8-27B
      - key: AGENT_MAX_TURNS
        value: "6"
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: LLM_MAX_TOKENS
        value: "2000"
      - key: LLM_REASONING_EFFORT
        value: low
      # Arena
      - key: ARENA_ALLOWED_ORIGINS
        sync: false
      - key: ARENA_TRUST_PROXY
        value: "1"
      - key: ARENA_RATE_LIMIT_SECONDS
        value: "20"
      - key: ARENA_DAILY_LIMIT
        value: "300"
      - key: ARENA_MAX_MESSAGE_CHARS
        value: "1500"
      - key: ARENA_MAX_QUEUE
        value: "5"
      - key: ARENA_FEED_SIZE
        value: "20"
      - key: ARENA_ATTEMPT_TIMEOUT_MS
        value: "150000"
      - key: ARENA_CHAIN_REFRESH_MS
        value: "10000"
      - key: ARENA_DATA_FILE
        value: data/attempts.jsonl
      - key: ARENA_MODEL_GUARDED
        value: Qwen/Qwen3.8-27B
      - key: ARENA_MODEL_JAILBROKEN
        value: Qwen/Qwen3.8-27B-abliterated
      # Owner-action relay: pays gas for Face ID-signed owner actions on the
      # demo wallets. Its key holds no permission on any wallet.
      - key: RELAY_ACCOUNT
        value: allowance-relay-07515.testnet
      - key: RELAY_SECRET_KEY
        sync: false
      - key: RELAY_WALLETS
        value: allowance-demo-07515.testnet,allowance-arena-07515.testnet
      - key: RELAY_RATE_LIMIT_SECONDS
        value: "10"
