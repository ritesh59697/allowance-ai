<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allowance: a wallet for AI agents that a prompt can't empty</title>
    <meta
      name="description"
      content="An AI agent's NEAR wallet with the spending rules enforced on-chain. Payments outside your limits wait for your Face ID."
    />
    <meta name="theme-color" content="#141415" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong
      // colors. Same rule as src/lib/theme.ts: a saved "light" or "dark"
      // wins, otherwise follow the system.
      ;(function () {
        var pref = null
        try {
          pref = JSON.parse(localStorage.getItem('theme'))
        } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allowance" />
    <meta property="og:title" content="Allowance: a wallet for AI agents that a prompt can't empty" />
    <meta
      property="og:description"
      content="Spending rules enforced by a NEAR contract. Everything else waits for your Face ID."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
